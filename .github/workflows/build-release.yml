name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            artifact: msdf-atlas-gen-linux-x64
            binary_path: build/bin/msdf-atlas-gen
          - name: macos-arm64
            os: macos-14
            artifact: msdf-atlas-gen-macos-arm64
            binary_path: build/bin/msdf-atlas-gen
          - name: win64
            os: windows-latest
            artifact: msdf-atlas-gen-win64.exe
            binary_path: build/bin/Release/msdf-atlas-gen.exe

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libfreetype-dev libpng-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list libpng &>/dev/null || brew install libpng
          brew list freetype &>/dev/null || brew install freetype

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DMSDF_ATLAS_USE_VCPKG=OFF \
            -DMSDF_ATLAS_USE_SKIA=OFF \
            -DBUILD_SHARED_LIBS=OFF

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DMSDF_ATLAS_USE_VCPKG=OFF \
            -DMSDF_ATLAS_USE_SKIA=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DPNG_PNG_INCLUDE_DIR=$(brew --prefix libpng)/include \
            -DPNG_LIBRARY_RELEASE=$(brew --prefix libpng)/lib/libpng.dylib \
            -DCMAKE_PREFIX_PATH="$(brew --prefix libpng);$(brew --prefix freetype)"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir build && cd build
          cmake .. ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DMSDF_ATLAS_USE_SKIA=OFF ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Rename binary
        shell: bash
        run: |
          # Handle both single-config and multi-config generator paths
          if [ -f "${{ matrix.binary_path }}" ]; then
            cp "${{ matrix.binary_path }}" "${{ matrix.artifact }}"
          elif [ -f "build/bin/msdf-atlas-gen" ]; then
            cp "build/bin/msdf-atlas-gen" "${{ matrix.artifact }}"
          elif [ -f "build/bin/msdf-atlas-gen.exe" ]; then
            cp "build/bin/msdf-atlas-gen.exe" "${{ matrix.artifact }}"
          else
            echo "ERROR: Could not find built binary"
            find build/bin -type f
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
